services:
  - type: web
    name: sppio-core
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    envVars:
      - key: EXAMOS_CORS_ALLOWED_ORIGINS
        value: https://sppio-os.vercel.app,http://localhost:5173
      - key: DATABASE_URL
        fromDatabase:
          name: sppio-db
          property: connectionString
      - key: EXAMOS_MAX_CLIENTS
        value: 128

databases:
  - name: sppio-db
    plan: free
    databaseName: sppio
    user: sppio_admin
