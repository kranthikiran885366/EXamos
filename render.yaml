services:
  - type: web
    name: sppio-core
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile

    # ── Health check ──────────────────────────────────────────────────────────
    healthCheckPath: /api/v1/health

    envVars:
      # ── CORS ──────────────────────────────────────────────────────────────
      - key: EXAMOS_CORS_ALLOWED_ORIGINS
        value: https://sppio-os.vercel.app,http://localhost:5173

      # ── Runtime mode ──────────────────────────────────────────────────────
      # production: enables HMAC journal enforcement, Secure cookie flag,
      # TPM attestation checks, and disallows unauthenticated fallbacks.
      - key: EXAMOS_TPM_MODE
        value: production

      # ── Admin cookie Secure flag ───────────────────────────────────────────
      # Must be "1" so the HttpOnly admin_session cookie carries Secure=true
      # on the Render HTTPS endpoint (the C server checks this env var).
      - key: EXAMOS_ADMIN_COOKIE_SECURE
        value: "1"

      # ── Unprovisioned dev bypass — DISABLED in production ─────────────────
      - key: EXAMOS_ALLOW_UNPROVISIONED_DEV
        value: "0"

      # ── Browser policy catalog ────────────────────────────────────────────
      - key: EXAMOS_BROWSER_POLICY_CATALOG
        value: /opt/sppio/config/browser_policies.json

      # ── Database (injected by Render from the linked database) ────────────
      - key: DATABASE_URL
        fromDatabase:
          name: sppio-db
          property: connectionString

      # ── Connection limits ─────────────────────────────────────────────────
      - key: EXAMOS_MAX_CLIENTS
        value: "128"

      # ── Session journal HMAC key ───────────────────────────────────────────
      # 64-char hex (32 bytes) CSPRNG. Rotate via Render dashboard after deploy.
      - key: EXAMOS_LEDGER_HMAC_KEY
        value: "31d126f82cb147d0c71d0acc5a28cc4c760a74269f6b532f1bd9209801f90f3b"

      # ── Agent API token (device attestation) ──────────────────────────────
      # 64-char hex (32 bytes) CSPRNG. Rotate via Render dashboard after deploy.
      - key: EXAMOS_AGENT_API_TOKEN
        value: "6d264348b229a1e8ac6bf8dba35f63022b8fe4de11f7a7e4f751a2002e4a6a82"

      # ── Exam key encryption KEK ────────────────────────────────────────────
      # 64-char hex (32 bytes) CSPRNG. Rotate via Render dashboard after deploy.
      - key: EXAMOS_EXAM_KEY_KEK
        value: "55356519e746d6a28e24e2ec11118ef7405fba1e73ba8ed3e9efa44579964725"

databases:
  - name: sppio-db
    plan: free
    databaseName: sppio
    user: sppio_admin
