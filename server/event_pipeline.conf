# Event Pipeline Configuration
# This file controls the behavior of the durable event pipeline for security and operational events.

# Journal Settings
# Path to the write-ahead log file for durable event storage
journal_path=/var/log/examos/event_pipeline.log
# Maximum size of journal file before rotation (in MB)
journal_max_size_mb=100
# Number of rotated journal files to keep
journal_rotation_count=5

# Cache Settings
# Number of events to keep in memory for fast search
event_cache_size=10000
# Cache eviction policy: 0=FIFO, 1=LRU, 2=severity-based
cache_eviction_policy=0

# Alert Settings
# Maximum number of alert rules that can be configured
max_alert_rules=128
# Default deduplication window in seconds (5 minutes)
default_dedup_window_sec=300

# Deduplication Settings
# Enable event deduplication to prevent duplicate alerts
deduplication_enabled=1
# Size of deduplication hash table (must be power of 2 recommended)
dedup_hash_table_size=1024

# Performance Settings
# Interval between journal flushes in milliseconds
flush_interval_ms=1000
# Number of events to batch before writing to journal
batch_write_size=10
# Enable asynchronous writes (experimental)
async_writes_enabled=0

# Security Settings
# Validate events for sensitive data before ingestion
validate_sensitive_data=1
# Automatically sanitize event details to remove sensitive information
sanitize_details=1

# Runtime Limits
# Maximum length of event details field
max_event_details_len=512
# Maximum length of evidence references field
max_evidence_refs_len=256
# Maximum concurrent search operations
max_concurrent_searches=10
