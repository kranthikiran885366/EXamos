# Append to a signed UKI's kernel command line for the measured profile.
# Firmware must enable DMA/interrupt remapping. The watchdog checks actual
# IOMMU groups; merely supplying these parameters does not qualify hardware.
iommu.passthrough=0 iommu.strict=1 intel_iommu=on efi=disable_early_pci_dma ima_hash=sha256 lsm=landlock,lockdown,yama,integrity,apparmor,bpf
