[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64
Repositories=main,contrib,non-free,non-free-firmware
# Pinned Debian snapshot. mkosi derives the Debian and security archive URLs.
Snapshot=20261018T000000Z

[Output]
Format=disk
Output=examos-p0
Seed=f244e829-48b5-482f-a895-9af3ab43b70e

[Content]
Packages=
    linux-image-amd64
    libstdc++6
    libpq5
    login
    passwd
    sudo
    systemd
    systemd-boot
    systemd-boot-efi
    udev
Bootable=yes
Bootloader=systemd-boot
KernelCommandLine=console=tty0 console=ttyS0 systemd.log_target=console systemd.log_level=info systemd.firstboot=0 systemd.unit=multi-user.target
RemoveFiles=/var/cache/ldconfig/aux-cache,/var/log/alternatives.log

[Build]
Incremental=no
CacheDirectory=../../cache/p0
BuildDirectory=../../build/p0
