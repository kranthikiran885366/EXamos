[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64
Repositories=main,contrib,non-free,non-free-firmware
# Pinned Debian snapshot. Keep in sync with image/p0/sources.lock.
Mirror=https://snapshot.debian.org/archive/debian/20261018T000000Z

[Output]
Format=disk
Output=examos-p0

[Content]
Packages=
    linux-image-amd64
    libstdc++6
    login
    passwd
    sudo
    systemd
    systemd-boot
    systemd-boot-efi
    udev
Bootable=yes
Bootloader=systemd-boot
KernelCommandLine=console=tty0 console=ttyS0 systemd.log_target=console systemd.log_level=info systemd.firstboot=0 systemd.unit=multi-user.target

[Build]
Incremental=no
CacheDirectory=../../cache/p0
BuildDirectory=../../build/p0
