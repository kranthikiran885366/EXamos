[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64

[Output]
Format=disk
Output=examos

[Content]
Packages=
    linux-image-amd64
    systemd
    systemd-boot
    systemd-boot-efi
    udev
    dbus
    cage
    chromium
    fonts-liberation
    fontconfig
    xkb-data
    pipewire
    wireplumber
    pipewire-pulse
    tpm2-tools
    tpm2-abrmd
    cryptsetup-bin
    usbguard
    libtss2-tcti-device0
    libtss2-tcti-tabrmd0
    util-linux
    python3
    postgresql
    postgresql-client
    network-manager
    wpasupplicant
    iw
    ca-certificates
    openssl
    nftables
    apparmor
    libssl3
    libpq5
    libcurl4
    libudev1
    pulseaudio-utils
    v4l-utils
    xorriso
    libgl1-mesa-dri
    kbd
    libopencv-core410
    libopencv-dnn410
    libopencv-imgproc410
    libopencv-imgcodecs410
    libopencv-videoio410
    libopencv-calib3d410
    libopencv-features2d410
    libopencv-objdetect410
    libopencv-photo410
Bootable=yes
Bootloader=systemd-boot
KernelCommandLine=console=tty0 console=ttyS0 quiet systemd.log_target=console systemd.log_level=info systemd.firstboot=0 systemd.unit=graphical.target lockdown=confidentiality systemd.unified_cgroup_hierarchy=1

[Build]
Incremental=no
CacheDirectory=../cache
BuildDirectory=../build
Packages=
    gcc
    g++
    make
    pkg-config
    libssl-dev
    libpq-dev
    libcurl4-openssl-dev
    libopencv-dev
