[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64

[Output]
Format=disk
Output=examos-p0.raw

[Content]
Packages=
    linux-image-amd64
    systemd
    systemd-boot
    systemd-boot-efi
    udev
Bootable=yes
Bootloader=systemd-boot
KernelCommandLine=console=ttyS0 systemd.log_target=console systemd.log_level=info systemd.firstboot=0 systemd.unit=multi-user.target

[Build]
Incremental=no
CacheDirectory=../cache/p0
BuildDirectory=../build/p0
