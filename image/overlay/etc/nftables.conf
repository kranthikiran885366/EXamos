# ExamOS Default-Deny Security Firewall Ruleset
# Only strictly required examination ports are permitted outbound

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority 0; policy drop;

        # Allow loopback interface traffic
        iif "lo" accept

        # Allow established and related connections
        ct state { established, related } accept

        # Drop invalid state packets
        ct state invalid drop

        # Allow DHCP client response
        udp sport 67 udp dport 68 accept
        udp sport 547 udp dport 546 accept

        # Reject all other inbound with ICMP admin prohibited
        reject with icmpx type admin-prohibited
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
    }

    chain output {
        type filter hook output priority 0; policy drop;

        # Allow loopback interface traffic
        oif "lo" accept

        # Allow established and related connections
        ct state { established, related } accept

        # Allow DNS resolution (UDP/TCP 53)
        udp dport 53 accept
        tcp dport 53 accept

        # Allow HTTPS outbound (TCP 443) for examination server
        tcp dport 443 accept

        # Allow HTTP outbound (TCP 80) for CA certificate verification
        tcp dport 80 accept

        # Allow Network Time Protocol (UDP 123)
        udp dport 123 accept

        # Allow DHCP requests
        udp sport 68 udp dport 67 accept
        udp sport 546 udp dport 547 accept

        # Drop and log all other outbound traffic
        limit rate 5/minute log prefix "[ExamOS-Firewall-Blocked-Out]: "
        drop
    }
}
