# ExamOS Module F — Secure Kiosk Virtual Terminal & Session Lockdown
# Restricts access to virtual terminals (VT1-VT12), prevents user process persistence,
# and disables physical power/lid key hijacking during examination sessions.

[Login]
# Disables automatic spawning of getty on Ctrl+Alt+F1..F12
NAutoVTs=0
ReserveVT=0

# Ensure no orphaned candidate processes survive session termination
KillUserProcesses=yes

# Prevent hardware power button, lid close, or suspend keys from terminating the kiosk
HandlePowerKey=ignore
HandleSuspendKey=ignore
HandleHibernateKey=ignore
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
