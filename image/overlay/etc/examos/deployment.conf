# ExamOS Deployment Network Configuration
# =========================================
# Fill in all DEPLOYMENT_REQUIRED values before provisioning this appliance.
# Run: bash /usr/local/sbin/generate-nftables.sh
# to generate /etc/nftables.conf from these values and reload the firewall.
#
# All IPs must be addresses on your organisation's own infrastructure.
# Public resolvers (1.1.1.1, 8.8.8.8), documentation ranges (192.0.2.0/24),
# and placeholder ranges (0.0.0.0/8) are rejected by the generator.
#
# Permissions: root:root 0640

# Organisational DNS resolver(s). Use the same IP for both if you have one.
CONTROLLED_DNS_1=DEPLOYMENT_REQUIRED
CONTROLLED_DNS_2=DEPLOYMENT_REQUIRED

# Exam server HTTPS endpoint IP address.
# If you have a single server, set both to the same address.
EXAM_SERVER_IP_1=DEPLOYMENT_REQUIRED
EXAM_SERVER_IP_2=DEPLOYMENT_REQUIRED

# Organisational NTP server(s). Use the same IP for both if you have one.
NTP_SERVER_IP_1=DEPLOYMENT_REQUIRED
NTP_SERVER_IP_2=DEPLOYMENT_REQUIRED

# CA OCSP responder IP (for certificate validation during TLS handshake).
OCSP_RESPONDER_IP=DEPLOYMENT_REQUIRED
