# ExamOS P2 — USBGuard Policy Rules
# Policy version: p2.1
#
# Rule evaluation order: first matching rule wins.
#
# Device classes used:
#   03  HID (keyboards, mice, touchscreens)
#   01  Audio (headsets, microphones)
#   0e  Video (UVC webcams)
#   09  Hub (needed to enumerate child devices)
#
# Security notes:
#   - Rules match on interface (bInterfaceClass) not device class to handle
#     composite devices.  A device presenting BOTH a HID and a storage
#     interface (class 08) is rejected by the storage block rule, not passed
#     by the HID allow rule.  Order matters: block rules precede allow rules.
#   - USB 3.x hubs report bDeviceClass=09; they are allowed so that peripherals
#     connected through a hub are enumerable.
#   - "with-interface" matching inspects all interfaces on the device.
#     A composite device that presents any disallowed interface is rejected
#     even if it also presents an allowed interface.

# ---------------------------------------------------------------------------
# BLOCK rules — evaluated first
# Any device presenting these interface classes is blocked unconditionally,
# regardless of other interfaces it may also present.
# ---------------------------------------------------------------------------

# Block USB Mass Storage (class 08, subclass any)
block with-interface match-all { 08:*:* }

# Block USB Network / CDC Ethernet (class 02 and subclasses e0/e1)
block with-interface match-all { 02:*:* }
block with-interface match-all { 0a:*:* }

# Block smart card readers (class 0b)
block with-interface match-all { 0b:*:* }

# Block wireless controllers / Bluetooth USB dongles (class e0)
block with-interface match-all { e0:*:* }

# Block miscellaneous / vendor-specific (class ff) by default
block with-interface match-all { ff:*:* }

# Block USB DFU (firmware update) — class fe subclass 01
block with-interface match-all { fe:01:* }

# Block any composite device that exposes BOTH HID AND storage
# (catches "rubber ducky" style attack peripherals)
block with-interface all-of { 03:*:* 08:*:* }
block with-interface all-of { 03:*:* 02:*:* }
block with-interface all-of { 03:*:* e0:*:* }

# ---------------------------------------------------------------------------
# ALLOW rules — evaluated after block rules
# Only devices with EXCLUSIVELY allowed interface classes are permitted.
# ---------------------------------------------------------------------------

# Allow USB Hubs (class 09) — required for multi-port connectivity
allow with-interface match-all { 09:*:* }

# Allow HID-only devices (keyboards and mice, class 03)
# "match-all" ensures every interface on the device is HID.
allow with-interface match-all { 03:*:* }

# Allow UVC webcam (class 0e: video, often paired with class 01 audio on the same device)
allow with-interface all-of { 0e:*:* }
allow with-interface all-of { 0e:*:* 01:*:* }

# Allow USB Audio only devices (class 01 exclusively — headsets, microphones)
allow with-interface match-all { 01:*:* }

# Allow USB Audio + HID composite (e.g. headset with volume control buttons)
allow with-interface all-of { 01:*:* 03:*:* }

# ---------------------------------------------------------------------------
# Default — all other devices blocked (ImplicitPolicyTarget=block in daemon
# config provides the final catch-all; these rules are belt-and-suspenders)
# ---------------------------------------------------------------------------
block
