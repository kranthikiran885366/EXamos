# ExamOS P2 — USBGuard Daemon Configuration
# Policy version: p2.1

# Rule policy file
RuleFile=/etc/usbguard/rules.conf

# Implicit policy for devices not matched by any rule.
# "block" means the device is not authorized and cannot be used.
ImplicitPolicyTarget=block

# Present policy: what to do with devices present at daemon start.
# "apply-policy" re-evaluates each present device against the rules.
# This ensures devices connected before USBGuard started are still
# subject to policy (handles pre-boot USB connections).
PresentDevicePolicy=apply-policy

# New device policy: how to handle devices attached after daemon starts.
# "apply-policy" is correct; combined with ImplicitPolicyTarget=block
# this means unknown devices are blocked on hotplug.
InsertedDevicePolicy=apply-policy

# Notify on USB events via IPC
IPCAllowedUsers=root
IPCAllowedGroups=

# Audit backend — log all USB authorization decisions to the journal
AuditBackend=LinuxAudit

# Do not restore authorized_default after daemon stops.
# Our examos-usb-lockdown.service sets authorized_default=0 independently.
RestoreControllerDeviceState=false
