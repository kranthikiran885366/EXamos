# ExamOS Development / Test Image Profile
# Inherits from mkosi.conf and adds diagnostic packages.
# NEVER distribute this image to candidates.
# Only tests/p2/ scripts that require a shell must target this flavour.
[Output]
Output=examos-dev

[Content]
Packages=
    # All base packages from mkosi.conf are inherited when building with
    # --profile=dev. List only additions here.
    bash
    util-linux
    procps
    iproute2
    iputils-ping
    nmap
    strace
    less
    vim-tiny
    curl
    wget
    openssh-client
    # veritysetup / cryptsetup for manual dm-verity testing inside dev image
    cryptsetup-bin
    # USBGuard for policy testing
    usbguard
    # systemd coredump (disabled in release; available for dev triage)
    systemd-coredump
    # Module inspection
    kmod

# Development-only kernel cmdline additions
# (serial debug console, no forced lockdown-confidentiality for live debug)
KernelCommandLine=console=tty0 console=ttyS0 quiet
    systemd.log_target=console systemd.log_level=info
    systemd.firstboot=0 systemd.unit=graphical.target
    lockdown=integrity
    systemd.unified_cgroup_hierarchy=1
    examos.flavour=dev
