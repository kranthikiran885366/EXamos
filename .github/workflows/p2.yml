name: ExamOS P2 — OS Lockdown Gate

on:
  push:
    branches: [main, develop, 'phase/p2']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  p2-gate:
    name: P2 Gate — Lockdown Static Audit + Policy Verification + P1 Regression
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      - name: Enforce clean source tree
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all 2>/dev/null)" ]; then
            echo "FATAL: Source tree is DIRTY — P2 gate refuses to run on a dirty tree." >&2
            git status --short --untracked-files=all | head -30 >&2
            exit 1
          fi
          echo "Source tree is CLEAN at commit $(git rev-parse HEAD)"

      # -----------------------------------------------------------------------
      - name: Install P2 dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc g++ make \
            libssl-dev libcurl4-openssl-dev \
            python3 jq curl \
            nftables \
            usbguard \
            cryptsetup-bin sbsigntool binutils \
            apparmor apparmor-utils \
            qemu-system-x86 ovmf \
            mkosi systemd-container \
            xorriso

      # -----------------------------------------------------------------------
      - name: Compile all native subsystems
        run: make clean && make all

      # -----------------------------------------------------------------------
      - name: Collect P2 tool versions and baseline artifacts
        run: |
          mkdir -p artifacts/phase2
          bash tests/p2/p2-p1-regression.sh 2>&1 | tee artifacts/phase2/p1-regression.log

      # -----------------------------------------------------------------------
      # Static audit — runs without a booted guest, checks source files.
      # This step must exit 0.  Any non-zero exit is a gate failure.
      - name: P2 static audit (source, config, policy files)
        run: bash tests/p2/p2-static-audit.sh

      # -----------------------------------------------------------------------
      # Chromium policy validation — parses and validates the managed policy
      # JSON for all mandatory fields. No running browser required.
      - name: P2 Chromium policy validation (static)
        run: bash tests/p2/p2-chromium-policy-tests.sh

      # -----------------------------------------------------------------------
      # USB policy validation — validates USBGuard config files.
      # Runtime USB hardware tests are BLOCKED in CI (no real USB devices).
      # The static config check is mandatory and must pass.
      - name: P2 USB policy validation (static config)
        run: bash tests/p2/p2-usb-tests.sh

      # -----------------------------------------------------------------------
      # Verify that the agent.service unit does NOT contain any hardcoded
      # credentials, tokens, or development values.
      - name: Verify no hardcoded secrets in agent.service (mandatory)
        run: |
          SVC="image/overlay/etc/systemd/system/examos-agent.service"
          FAILED=0

          # Must NOT contain any Environment= lines with secret values
          if grep -E "^Environment=.*TOKEN" "$SVC" 2>/dev/null; then
            echo "FAIL: agent.service contains hardcoded TOKEN in Environment= line" >&2
            FAILED=$((FAILED + 1))
          else
            echo "PASS: No hardcoded TOKEN in Environment= lines"
          fi

          if grep -E "^Environment=.*SECRET" "$SVC" 2>/dev/null; then
            echo "FAIL: agent.service contains hardcoded SECRET in Environment= line" >&2
            FAILED=$((FAILED + 1))
          else
            echo "PASS: No hardcoded SECRET in Environment= lines"
          fi

          # Must NOT contain a development placeholder token pattern
          if grep -E "dev-agent-token|placeholder|changeme|test-token|build-2025" "$SVC" 2>/dev/null; then
            echo "FAIL: agent.service contains development token placeholder" >&2
            FAILED=$((FAILED + 1))
          else
            echo "PASS: No development token placeholders"
          fi

          # Must reference EnvironmentFile for secrets
          if grep -q "^EnvironmentFile=" "$SVC" 2>/dev/null; then
            echo "PASS: agent.service uses EnvironmentFile for runtime config"
          else
            echo "FAIL: agent.service must use EnvironmentFile= for secrets" >&2
            FAILED=$((FAILED + 1))
          fi

          if [ "$FAILED" -gt 0 ]; then
            echo "FAIL: $FAILED secret hygiene check(s) failed" >&2
            exit 1
          fi
          echo "PASS: agent.service secret hygiene checks passed"

      # -----------------------------------------------------------------------
      # Verify launcher.c has no sandbox-disabling flags (P1+P2 regression).
      - name: Verify launcher.c has no sandbox-disabling flags (mandatory)
        run: |
          LAUNCHER="kiosk/launcher/launcher.c"
          FAILED=0
          for flag in "--no-sandbox" "--disable-gpu-sandbox" "--test-type" \
                      "--disable-seccomp-filter-sandbox"; do
            if grep -q "$flag" "$LAUNCHER" 2>/dev/null; then
              echo "FAIL: launcher.c contains prohibited flag: $flag" >&2
              FAILED=$((FAILED + 1))
            else
              echo "PASS: launcher.c does not contain: $flag"
            fi
          done
          if grep -qE 'http://127\.0\.0\.1:[0-9]+/' "$LAUNCHER" 2>/dev/null; then
            echo "FAIL: launcher.c contains a hardcoded fallback URL" >&2
            FAILED=$((FAILED + 1))
          else
            echo "PASS: No hardcoded fallback URL in launcher.c"
          fi
          if [ "$FAILED" -gt 0 ]; then
            echo "FAIL: $FAILED prohibited launcher.c flag(s) found" >&2
            exit 1
          fi

      # -----------------------------------------------------------------------
      # Build ExamOS P2 image (required for verity and boot tests).
      - name: Build ExamOS P2 image
        run: |
          mkdir -p artifacts/phase2
          cd image
          sudo mkosi build 2>&1 | tee ../artifacts/phase2/build.log

      - name: Discover artifact and record digest
        run: |
          IMAGE_FILE=""
          for cand in image/examos.raw.raw image/examos.raw; do
            if [ -f "$cand" ] && [ -s "$cand" ]; then
              IMAGE_FILE="$cand"
              break
            fi
          done
          if [ -z "$IMAGE_FILE" ]; then
            echo "FAIL: No image artifact found after P2 build" >&2
            exit 1
          fi
          sha256sum "$IMAGE_FILE" > artifacts/phase2/image.sha256
          stat -c %s "$IMAGE_FILE" > artifacts/phase2/image-size.txt
          echo "IMAGE_FILE=$IMAGE_FILE" >> "$GITHUB_ENV"
          echo "IMAGE_DIGEST=$(cut -d' ' -f1 < artifacts/phase2/image.sha256)" >> "$GITHUB_ENV"
          echo "Artifact: $IMAGE_FILE"
          cat artifacts/phase2/image.sha256

      # -----------------------------------------------------------------------
      # dm-verity tests — requires cryptsetup-bin and the built squashfs.
      # Blocked in CI if the build did not produce a verity-capable artifact.
      - name: P2 dm-verity tests
        run: bash tests/p2/p2-verity-tests.sh
        env:
          ARTIFACT_DIR: artifacts/phase2
        continue-on-error: false

      # -----------------------------------------------------------------------
      # P2 gate evaluation.
      #
      # The gate script aggregates all sub-test results.  Exit codes:
      #   0 = PASS (all 20 mandatory tests pass)
      #   1 = FAIL (one or more tests failed or NOT_RUN)
      #   2 = BLOCKED (static tests pass; runtime guest tests need a real boot)
      #
      # In CI we treat BLOCKED as FAIL because NOT_RUN cannot count as passing.
      # When guest integration tests are needed, run tests/p2/p2-gate.sh
      # inside a booted ExamOS VM.
      # -----------------------------------------------------------------------
      # P2 gate evaluation.
      #
      # The gate script aggregates all sub-test results.  Exit codes:
      #   0 = PASS (all 20 mandatory tests pass)
      #   1 = FAIL (one or more tests failed or NOT_RUN)
      #   2 = BLOCKED (static tests pass; runtime guest tests need a real boot)
      #
      # In CI we treat BLOCKED as FAIL because NOT_RUN cannot count as passing.
      # When guest integration tests are needed, run tests/p2/p2-gate.sh
      # inside a booted ExamOS VM.
      - name: Secure Boot and dm-verity verification gate (C6)
        run: |
          # C6 fix: real cryptographic Secure Boot and dm-verity verification.
          # sbverify validates the UKI Authenticode signature.
          # veritysetup verify proves the SquashFS + hash tree is coherent.
          # A corrupted SquashFS is dynamically proven to be rejected.
          bash tests/p2/p2-secureboot-gate.sh || SB_RC=$?
          echo "Secure Boot gate exit code: ${SB_RC:-0}"
          if [ "${SB_RC:-0}" -ne 0 ]; then
            echo "FATAL: Secure Boot / dm-verity gate is not a complete PASS" >&2
            exit 1
          fi
        env:
          ARTIFACT_DIR: artifacts/phase2

      - name: P2 gate decision
        run: |
          if bash tests/p2/p2-gate.sh; then
            GATE_RC=0
          else
            GATE_RC=$?
          fi
          if [ "$GATE_RC" -eq 0 ]; then
            echo "[P2-CI] GATE: PASS"
          elif [ "$GATE_RC" -eq 2 ]; then
            echo "[P2-CI] GATE: BLOCKED — runtime guest tests could not run in CI" >&2
            echo "[P2-CI] BLOCKED counts as FAIL until all mandatory tests can execute." >&2
            exit 1
          else
            echo "[P2-CI] GATE: FAIL" >&2
            exit 1
          fi

      # -----------------------------------------------------------------------
      - name: Show P2 gate results
        if: always()
        run: |
          echo "=== P2 Gate Results ==="
          cat artifacts/phase2/phase2-manifest.json 2>/dev/null \
            || echo "phase2-manifest.json not generated"
          echo ""
          echo "=== P2 Static Audit Log (last 40 lines) ==="
          tail -40 artifacts/phase2/p2-static-audit.log 2>/dev/null \
            || echo "p2-static-audit.log not available"

      # -----------------------------------------------------------------------
      - name: Upload P2 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: examos-p2-artifacts
          path: artifacts/phase2/
          retention-days: 30
