name: ExamOS P0 — Foundation Build and Boot Gate

on:
  push:
    branches: [main, develop, 'phase/p0']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  p0-gate:
    name: P0 Gate — Build & OVMF Boot
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install P0 Build Tools & Firmware
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git qemu-system-x86 ovmf swtpm swtpm-tools tpm2-tools \
            sbsigntool efitools cryptsetup-bin squashfs-tools mkosi \
            systemd-container debian-archive-keyring

      - name: Run Host & Environment Check
        run: bash tests/p0/host-check.sh

      - name: Run Doctor Diagnostics
        run: bash tests/p0/examos-doctor.sh

      - name: Check Repository Structure & Secrets
        run: bash tests/p0/repository-check.sh

      - name: Execute Full P0 Build and Boot Pipeline
        run: bash scripts/p0.sh

      - name: Upload P0 Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: examos-p0-artifacts
          path: artifacts/p0/
          retention-days: 30
