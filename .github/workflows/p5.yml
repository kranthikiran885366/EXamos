name: ExamOS P5 — Behaviour, Variant, Viva Gate

on:
  push:
    branches: [main, develop, 'phase/p5']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  p5-gate:
    name: P5 Gate — Behaviour Engine + Variant Engine + Viva Engine
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      EXAMOS_TPM_MODE: development
      EXAMOS_VARIANT_SECRET: ci-variant-secret-32chars-test-only
      EXAMOS_BEHAVIOUR_STORE: /tmp/examos-p5-behaviour-store
      EXAMOS_VIVA_STORE: /tmp/examos-p5-viva-store
      EXAMOS_EVENT_SIGNING_KEY: ci-event-signing-key-32chars-test-only
      EXAMOS_LLM_ENDPOINT: ""
      EXAMOS_REVIEWER_TOKEN: ci-reviewer-token-32chars-test-only-xxxxx

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enforce clean source tree
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all 2>/dev/null)" ]; then
            echo "FATAL: Source tree is DIRTY — P5 gate refuses to run." >&2
            git status --short --untracked-files=all | head -30 >&2
            exit 1
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc g++ make pkg-config \
            libssl-dev libcurl4-openssl-dev libudev-dev libpq-dev libopencv-dev \
            openssl jq curl python3

      - name: Compile server with P5 engines
        run: |
          make clean && make native
          ls -la server/examos-server

      - name: P5.1 — Behaviour Engine Test
        run: |
          mkdir -p artifacts/phase5
          bash tests/p5/p5-behaviour-test.sh || BEH_RC=$?
          echo "Behaviour exit: ${BEH_RC:-0}"
          [ "${BEH_RC:-0}" -eq 1 ] && exit 1

      - name: P5.2 — Variant Engine Test
        run: |
          mkdir -p artifacts/phase5
          bash tests/p5/p5-variant-test.sh || VAR_RC=$?
          echo "Variant exit: ${VAR_RC:-0}"
          [ "${VAR_RC:-0}" -eq 1 ] && exit 1

      - name: P5.3 — Viva Engine Test
        run: |
          mkdir -p artifacts/phase5
          bash tests/p5/p5-viva-test.sh || VIVA_RC=$?
          echo "Viva exit: ${VIVA_RC:-0}"
          [ "${VIVA_RC:-0}" -eq 1 ] && exit 1

      - name: P5 gate decision
        run: |
          mkdir -p artifacts/phase5
          bash tests/p5/p5-gate.sh || GATE_RC=$?
          echo "P5 gate exit: ${GATE_RC:-0}"
          [ "${GATE_RC:-0}" -eq 1 ] && exit 1

      - name: Upload P5 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: examos-p5-artifacts
          path: artifacts/phase5/
          retention-days: 30
