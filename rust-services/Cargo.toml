[workspace]
resolver = "2"
members = [
    "sppio-pqc",
    "sppio-behavioral-ai",
    "sppio-securityd",
]

[workspace.package]
version = "2.19.0"
edition = "2021"
license = "Apache-2.0"
authors = ["SPPIO Security Engineering"]

[workspace.dependencies]
sha2 = "0.10"
sha3 = "0.10"
hmac = "0.12"
subtle = "2.6"
zeroize = { version = "1.8", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
base64 = "0.22"
ml-kem = "0.2"
ml-dsa = "0.0.4"
rand_core = "0.6"
getrandom = "0.2"
